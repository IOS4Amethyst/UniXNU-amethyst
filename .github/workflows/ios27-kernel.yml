# iOS 27 (iPhone15,4, 27.0.1 24A446) kernel build for amethyst: macos.yml with `--os ios-27.0.1-24A446` and UniXNU from
# IOS4Amethyst/UniXNU ios27-iphone15 (upstream main 82b847c + the profile). Kernel only for now: the iPadOS 17 payload and
# userdata steps stay off; the iPadOS 17 bootstrap candidate step of macos.yml is left out. Runs on pushes to this branch (a dispatch-only workflow is only listed once it is on main).
name: iOS 27 kernel

on:
  push:
    branches: [ios27]
  workflow_dispatch:
    inputs:
      defconfig:
        description: Defconfig name
        required: true
        default: amethyst_defconfig
      build_payload:
        description: "Build Payload"
        type: boolean
        default: false
      build_userdata:
        description: "Build Userdata (takes ~16GB disk)"
        type: boolean
        default: false
      data_ramdisk:
        description: "Data seed (owner-data.cdr from the Data seed workflow) for the payload"
        required: false
        default: ""
      root_policies:
        description: "Root-policy bundle for the payload (built here unless a path is given)"
        required: false
        default: ""
      xcode:
        description: Xcode version
        required: true
        default: "26.6"

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

jobs:
  build:
    runs-on: macos-26
    # ARTIFACT_PASSPHRASE is a secret of the environment of the same name (as gpu-addon.yml): the outputs hold the prelinked
    # Apple kernelcache, so they are only uploaded encrypted. This repository is public.
    environment: ARTIFACT_PASSPHRASE
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ inputs.xcode || '26.6' }}.app/Contents/Developer
      DEFCONFIG: ${{ inputs.defconfig || 'amethyst_defconfig' }}
      OS_PROFILE: ios-27.0.1-24A446

    steps:
      - name: Check out Device Repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check out UniXNU Core
        uses: actions/checkout@v4
        with:
          repository: IOS4Amethyst/UniXNU
          # The configuration-level parameter. Merge back to ios27-iphone15 once the
          # RELEASE kernel links and prelinks.
          ref: ios27-release-config-level
          path: unixnu-core
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out UEFI repo
        if: inputs.build_payload
        uses: actions/checkout@v4
        with:
          repository: IOS4Amethyst/uefi-amethyst.git
          ref: amethyst
          path: uefi-amethyst
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate root-policy bundle
        id: root-policies
        if: inputs.build_payload
        env:
          GIVEN: ${{ inputs.root_policies }}
        run: |
          set -euo pipefail
          # The bundle is written by this repository's "iOS 27 iPhone root policies" workflow
          # (scripts/build-ios27-root-policies.py) from the owner key. board.toml points the payload at
          # {tree}/build/sheng-source-storage/root-policies.bin, which is the tree outside the core checkout.
          if [ -n "$GIVEN" ]; then
            test -f "$GIVEN" || { echo "root-policy bundle not found: $GIVEN"; exit 1; }
            mkdir -p "$GITHUB_WORKSPACE/build/sheng-source-storage"
            cp "$GIVEN" "$GITHUB_WORKSPACE/build/sheng-source-storage/root-policies.bin"
            echo "board.toml root_policies: build/sheng-source-storage/root-policies.bin (from $GIVEN)"
          else
            echo "No root_policies given: the payload boot entry carries no root-policy bundle" \
                 "(the kernel boots without a root read, as in the last RAM-only test)."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install host tools
        run: |
          brew install llvm lld mtools dtc
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi

      - name: Select the device
        working-directory: ./unixnu-core
        run: ./unixnu defconfig "$DEFCONFIG" --os "$OS_PROFILE" -D "$GITHUB_WORKSPACE"

      - name: Prepare pinned PMGR kernelcache
        working-directory: ./unixnu-core
        run: |
          python3 - <<'PY'
          import sys
          import tomllib
          from pathlib import Path
          from types import SimpleNamespace
          sys.path.insert(0, 'scripts')
          from unixnu.ipsw import Ipsw, kernelcache
          profile = tomllib.loads(Path('profiles/os/ios-27.0.1-24A446/profile.toml').read_text())
          ctx = SimpleNamespace(board=profile, out_root=Path('out'))
          source = Ipsw(ctx, spec=profile['ipsw']['url'])
          print(kernelcache(ctx, source))
          PY
          echo "UNIXNU_KERNELCACHE=$GITHUB_WORKSPACE/unixnu-core/out/ipsw/24A446/kernelcache.decompressed" >> "$GITHUB_ENV"

      - name: Build kernel
        working-directory: ./unixnu-core
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./unixnu build kernel --os "$OS_PROFILE" -D "$GITHUB_WORKSPACE"

      - name: Build payload
        if: inputs.build_payload
        working-directory: ./unixnu-core
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          DATA_SEED: ${{ inputs.data_ramdisk }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "$DATA_SEED" ]; then
            test -f "$DATA_SEED" || { echo "Data seed not found: $DATA_SEED"; exit 1; }
            extra+=(--data-ramdisk "$DATA_SEED")
          fi
          ./unixnu build payload --os "$OS_PROFILE" --uefi uefi-amethyst --edk2 uefi-amethyst/Mu_Basecore \
            -D "$GITHUB_WORKSPACE" ${extra[@]+"${extra[@]}"}   # bash 3.2: an empty array is unbound under set -u

      - name: Build userdata
        if: inputs.build_userdata
        working-directory: ./unixnu-core
        run: ./unixnu build userdata --os "$OS_PROFILE" -D "$GITHUB_WORKSPACE"

      - name: Encrypt compiled binaries and logs
        if: always()
        env:
          ARTIFACT_PASSPHRASE: ${{ secrets.ARTIFACT_PASSPHRASE }}
        run: |
          set -uo pipefail
          [ -n "$ARTIFACT_PASSPHRASE" ] || { echo "::error::No ARTIFACT_PASSPHRASE secret: nothing is uploaded."; exit 1; }
          # The kernel, payload, userdata and PMGR outputs carry the prelinked Apple kernelcache and ABI derived from it.
          # Decrypt: openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in ios27-build.tar.gz.enc -pass file:KEYFILE | tar xz
          # bash 3.2 on the macOS runner has no globstar: expand the patterns in Python.
          python3 - "$RUNNER_TEMP/files.txt" <<'PY'
          import glob, os, sys
          patterns = [
              'unixnu-core/out/**/kernel/**',
              'unixnu-core/out/**/payload/**',
              'unixnu-core/out/**/userdata/**',
              'unixnu-core/out/**/logs/*.log',
              'unixnu-core/out/**/tree/build/sheng-source-storage/**/*.log',
              'unixnu-core/out/**/tree/build/sheng-source-storage/**/*.command.json',
              'unixnu-core/out/**/tree/build/xnu/fileset-reference/**/*.log',
              'unixnu-core/out/**/tree/build/xnu/fileset-reference/**/*.json',
              'unixnu-core/out/**/tree/build/xnu/fileset-reference/mach.*.noctf',
              'unixnu-core/out/**/build/xnu/ios-obj/EXPORT_HDRS/osfmk/**/*.h',
              'unixnu-core/out/**/build/xnu/ios-obj/**/mach.*.noctf',
              'unixnu-core/out/**/tree/build/sheng-platform-power/ShengPlatformPower.o',
              'unixnu-core/out/**/tree/build/sheng-platform-power/OriginalPMGRABI.h',
              'unixnu-core/out/**/tree/build/sheng-platform-power/GuardedPMGRSlots.inc',
              'unixnu-core/out/**/tree/build/sheng-platform-power-arm64e/**',
              'unixnu-core/out/**/tree/build/xnu/ios-obj/**/IOPMGR.cpo',
              'unixnu-core/out/**/tree/build/xnu/ios-obj/**/IOPMGR.cpo.json',
              'unixnu-core/out/**/tree/build/xnu/ios-obj/**/IOPlatformExpert.cpo.json',
          ]
          files = sorted({f for p in patterns for f in glob.glob(p, recursive=True) if os.path.isfile(f)})
          open(sys.argv[1], 'wb').write(b''.join(f.encode() + b'\0' for f in files))
          print(len(files), 'files')
          PY
          mkdir -p "$RUNNER_TEMP/encrypted"
          [ -s "$RUNNER_TEMP/files.txt" ] || { echo "::warning::nothing to upload"; exit 0; }
          tar --null -czf - -T "$RUNNER_TEMP/files.txt" \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:ARTIFACT_PASSPHRASE \
              -out "$RUNNER_TEMP/encrypted/ios27-build.tar.gz.enc"

      - name: Upload encrypted build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-ios27-build-encrypted
          path: ${{ runner.temp }}/encrypted/ios27-build.tar.gz.enc
          if-no-files-found: warn
          retention-days: 7
