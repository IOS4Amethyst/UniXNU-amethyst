name: Temporary RAM seed with Setup skipped

on:
  workflow_dispatch:
  push:
    branches: [skip-setup-seed]
    paths:
      - .github/workflows/skip-setup-seed.yml
      - scripts/log/skip-setup-seed.py

permissions:
  contents: read
  actions: read

jobs:
  seed:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: amethyst-ipados-21H461-data-seed
          run-id: 41169591242
          github-token: ${{ github.token }}
          path: original
      - name: Verify original and fetch pinned packer
        run: |
          set -euo pipefail
          echo '0ce5f13c50c9723fbc6033590d41143a30b7218d22b63b595fbbf96597f64516  original/owner-data.cdr' | shasum -a 256 -c -
          curl -fLsS -o packed_ramdisk.py https://raw.githubusercontent.com/UniXNU/DarwinBoot/3325e352d7df68a9f9ad74832ed94a6acbbd7390/Test/packed_ramdisk.py
          python3 packed_ramdisk.py original/owner-data.cdr original/owner-data.packed
          echo '3d3c26c4e680812f557aa7af5efdb0b8cc387efecb49cadc95e0d30ccfeffa05  original/owner-data.packed' | shasum -a 256 -c -
      - name: Watchdog override (same as the current UI boot)
        run: |
          set -euo pipefail
          mkdir output
          sudo python3 scripts/log/disable-watchdog-seed.py original/owner-data.packed output/watchdog-disabled.packed --packer "$PWD/packed_ramdisk.py"
          sudo chown -R "$(id -u):$(id -g)" output
          echo '40d76e6f2a856f92ca999f07a38e7c0a89097e04223dde3ae74e0bb1c047545e  output/watchdog-disabled.packed' | shasum -a 256 -c - || echo 'note: watchdog seed differs from the local copy (non-deterministic pack)'
      - name: Skip Setup on a copy
        run: |
          set -euo pipefail
          sudo python3 scripts/log/skip-setup-seed.py --check
          sudo python3 scripts/log/skip-setup-seed.py output/watchdog-disabled.packed output/skip-setup.packed --packer "$PWD/packed_ramdisk.py"
          sudo chown -R "$(id -u):$(id -g)" output
          (cd output && shasum -a 256 watchdog-disabled.packed skip-setup.packed > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: amethyst-skip-setup-ram-seed
          path: |
            output/watchdog-disabled.packed
            output/skip-setup.packed
            output/skip-setup.packed.json
            output/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
