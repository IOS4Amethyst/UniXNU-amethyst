schema_version = 2

[board]
name = "amethyst"
soc = "SM7635"
soc_source = "sm7635"
os_profile = "ipados-17.7.11-21H461"
description = "Xiaomi Redmi Note 14 Pro+"
kit = "amethyst"

[components]
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "RamBlock", "XnuPrelink", "DarwinBoot", "AppleKeyStoreState", "AdrenoFirmware", "ShengUfs"]#, "Sm7635Platform"]

[userdata]
first_lba = 0x26c000
# Redmi Note 14 Pro+ 5G (amethyst) GPT captured by the read-only inspector:
# /dev/block/sda33 spans 2539520..124477434 in 4096-byte LBAs.
last_lba = 0x76b5ffa
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "amethyst_defconfig"
# The iOS 27 prelink fits the native segments around the collection's retained kexts, and
# com.apple.kernel's __DATA_CONST slot is 0xd8000. A DEVELOPMENT kernel's __DATA_CONST is
# 0x120000 (over by 0x48000) because KERNEL_DEV adds mach_assert, config_xnupost and
# development on top of KERNEL_BASE; the RELEASE set is KERNEL_BASE alone and measures
# 0xb8000. Every file in this board's patches, defconfig and kit sources that is gated on
# DEVELOPMENT or DEBUG is behind a config macro this board leaves off, so nothing
# board-specific is lost. See the porting record for the audit.
config_level = "RELEASE"
config_fragments = ["arch:configs/common.config", "soc:configs/sm7635.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu-12377/series", "os:patches/xnu/series", "device:patches/xnu/series"]
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "build-libpthread-kernel.py",
  "build-amethyst-platform-power.py",
  "component:ShengUfs",
  # The builder searches package/ and kits/sheng; this board's sources are package/, which the tree links as
  # kits/amethyst. It reads that directory from its [board] kit when the device repository is given, so
  # build-sheng-source-storage-amethyst.py passes --device from the tree's own resolution.
  "build-sheng-source-storage-amethyst.py --policy-dir scripts/policies/ios-27.0.1-24A446",
  "component:SoftwareAES",
  "build-native-aes-bindings.py",
  "component:RamBlock",
  "build-mockfs-fixture.py",
  "component:AppleKeyStoreState",
]

[device_tree]
source = "device:dts/amethyst.dts"
include_dirs = ["soc:dts"]

[firmware]
config = "amethyst"
dsc = "Platforms/Xiaomi/amethystPkg/amethyst.dsc"
fd = "Build/amethystPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Xiaomi",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Xiaomi",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
DEVICE_MODEL = "amethyst"
ENABLE_SECUREBOOT = "0"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "amethyst-bringup"

[bootimg.image]
base = 0x0
kernel_offset = 0x8000
tags_offset = 0x1e00000
pagesize = 4096
header_version = 4

[payload]
volume = "AMETHYSTESP"
size_mib = 128   # the iOS 27 kernel collection alone is ~76 MiB
loader = "firmware"
title = "iPadOS for amethyst"
# Source storage authenticates each root read against the owner-signed policy bundle written by
# build-sheng-source-storage.py from scripts/policies/ios-27.0.1-24A446 (544-byte signed headers;
# the full block tables remain a local input of the userdata image).
root_policies = "{tree}/build/sheng-source-storage/root-policies.bin"
dram_size = "0x1FFE00000"
# iOS 27 i2 (2026-11-07): DarwinBoot handed off and no kernel text appeared. The entry probe
# (panic_screen) paints blue at MMU-off entry and magenta before MMU enable; the timed reset
# 6 s after MMU enable shows whether translation came on. kernel87 (iPadOS) ran without it.
panic_screen = true
entry_probe_reset_delay = 6
kernel_args = [
  "-v",
  "serial=3",
  "debug=0x14e",
  "-enable_kprintf_spam",
  "-textconsole",
  "sheng-pmgr=2",
  # Source storage (build-sheng-source-storage.py) starts the UFS driver from its own
  # module-init pass after the original IOStorageFamily loads, so the personality stays
  # observation-only here. Persistence and logging stay off for the first root read.
  "native-source-storage=1",
  "native-ufs-root=1",
  "offline-apfs-load=1",
  "-apfs_shared_datavolume",
  "sheng-data-persist=0",
  "sheng-log=0",
]

[payload.adt]
# XNU uses zero as the no-SoC sentinel; kernel87 used this nonzero parent base.
arm_io_base = "0x01000000"
chip_id = "207"
unique_chip_id = "required"
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
packed_data_ramdisk = true
persistent_data = false
owned_memory_size = "0x130000000"
