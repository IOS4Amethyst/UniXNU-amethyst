# iOS 27 (iPhone15,4, 27.0.1 24A446) kernel build for amethyst: macos.yml with `--os ios-27.0.1-24A446` and UniXNU from
# IOS4Amethyst/UniXNU ios27-iphone15 (upstream main 82b847c + the profile). Kernel only for now: the iPadOS 17 payload and
# userdata steps stay off; the iPadOS 17 bootstrap candidate step of macos.yml is left out. Runs on pushes to this branch (a dispatch-only workflow is only listed once it is on main).
name: iOS 27 kernel

on:
  push:
    branches: [ios27]
  workflow_dispatch:
    inputs:
      defconfig:
        description: Defconfig name
        required: true
        default: amethyst_defconfig
      build_payload:
        description: "Build Payload"
        type: boolean
        default: false
      build_userdata:
        description: "Build Userdata (takes ~16GB disk)"
        type: boolean
        default: false
      xcode:
        description: Xcode version
        required: true
        default: "26.6"

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ inputs.xcode || '26.6' }}.app/Contents/Developer
      DEFCONFIG: ${{ inputs.defconfig || 'amethyst_defconfig' }}
      OS_PROFILE: ios-27.0.1-24A446

    steps:
      - name: Check out Device Repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check out UniXNU Core
        uses: actions/checkout@v4
        with:
          repository: IOS4Amethyst/UniXNU
          # The configuration-level parameter. Merge back to ios27-iphone15 once the
          # RELEASE kernel links and prelinks.
          ref: ios27-release-config-level
          path: unixnu-core
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out UEFI repo
        if: inputs.build_payload
        uses: actions/checkout@v4
        with:
          repository: IOS4Amethyst/uefi-amethyst.git
          ref: amethyst
          path: uefi-amethyst
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install host tools
        run: |
          brew install llvm lld mtools dtc
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi

      - name: Select the device
        working-directory: ./unixnu-core
        run: ./unixnu defconfig "$DEFCONFIG" --os "$OS_PROFILE" -D "$GITHUB_WORKSPACE"

      - name: Prepare pinned PMGR kernelcache
        working-directory: ./unixnu-core
        run: |
          python3 - <<'PY'
          import sys
          import tomllib
          from pathlib import Path
          from types import SimpleNamespace
          sys.path.insert(0, 'scripts')
          from unixnu.ipsw import Ipsw, kernelcache
          profile = tomllib.loads(Path('profiles/os/ios-27.0.1-24A446/profile.toml').read_text())
          ctx = SimpleNamespace(board=profile, out_root=Path('out'))
          source = Ipsw(ctx, spec=profile['ipsw']['url'])
          print(kernelcache(ctx, source))
          PY
          echo "UNIXNU_KERNELCACHE=$GITHUB_WORKSPACE/unixnu-core/out/ipsw/24A446/kernelcache.decompressed" >> "$GITHUB_ENV"

      - name: Build kernel
        working-directory: ./unixnu-core
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -c "
          import sys, os; sys.path.insert(0,'scripts')
          os.environ.setdefault('X',''); sys.argv=['unixnu','build','kernel','--os',os.environ['OS_PROFILE'],'-D',os.environ['GITHUB_WORKSPACE']]
          from unixnu.config import Context
          import unixnu.kernel as K
          orig = K.xnu_env
          def spy(ctx):
              e = orig(ctx)
              print('PROBE level =', e.get('UNIXNU_XNU_CONFIG_LEVEL'), flush=True)
              print('PROBE env key present =', 'UNIXNU_XNU_CONFIG_LEVEL' in e, flush=True)
              return e
          K.xnu_env = spy
          from unixnu import cli
          import atexit
          def check():
              from pathlib import Path as P
              f = P('out/amethyst/ios-27.0.1-24A446/amethyst/tree/scripts/kernel_target.py')
              print('PROBE tree target exists =', f.is_file(), flush=True)
              if f.is_file():
                  txt = f.read_text()
                  print('PROBE tree has CONFIG_LEVEL =', 'CONFIG_LEVEL' in txt, flush=True)
                  print('PROBE tree line =', [l for l in txt.splitlines() if 'CONFIG_LEVEL =' in l][:1], flush=True)
          atexit.register(check)
          _ba = K.build_archives
          def ba(ctx, env):
              print('PROBE build_archives env level =', env.get('UNIXNU_XNU_CONFIG_LEVEL'), flush=True)
              print('PROBE build_archives ctx.board level =', ctx.board.get('kernel', {}).get('config_level'), flush=True)
              from pathlib import Path as P
              f = P('out/amethyst/ios-27.0.1-24A446/amethyst/tree/scripts/kernel_target.py')
              print('PROBE archive-time target:', [l for l in f.read_text().splitlines() if 'CONFIG_LEVEL =' in l][:1], flush=True)
              return _ba(ctx, env)
          K.build_archives = ba
          cli.main()
          "
          ./unixnu build kernel --os "$OS_PROFILE" -D "$GITHUB_WORKSPACE"

      - name: Build payload
        if: inputs.build_payload
        working-directory: ./unixnu-core
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          ./unixnu build payload --uefi uefi-amethyst --edk2 uefi-amethyst/Mu_Basecore -D "$GITHUB_WORKSPACE"

      - name: Build userdata
        if: inputs.build_userdata
        working-directory: ./unixnu-core
        run: ./unixnu build userdata -D "$GITHUB_WORKSPACE"

      - name: Upload compiled binaries and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-ios27-kernel
          path: |
            unixnu-core/out/**/kernel/**
            unixnu-core/out/**/payload/**
            unixnu-core/out/**/userdata/**
            unixnu-core/out/**/logs/*.log
            # Per-source compiler logs and command lines of the source-storage archive: the build log only keeps the tail.
            unixnu-core/out/**/tree/build/sheng-source-storage/**/*.log
            unixnu-core/out/**/tree/build/sheng-source-storage/**/*.command.json
            # The RELEASE fileset reference the prelink matches against; its long build log only
            # exists here when the reference link fails. The binary is kept because RELEASE drops
            # the development/mach_assert/config_xnupost options the main DEVELOPMENT kernel
            # carries, so its __DATA_CONST is the measurement of how much that saves.
            unixnu-core/out/**/tree/build/xnu/fileset-reference/**/*.log
            unixnu-core/out/**/tree/build/xnu/fileset-reference/**/*.json
            unixnu-core/out/**/tree/build/xnu/fileset-reference/mach.*.noctf
            # The generated kernel headers the archive compiles against: xnu 12377 moved kmem_* out of the
            # exported vm_kern.h depending on XNU_KERNEL_PRIVATE, so keep the whole osfmk export set.
            unixnu-core/out/**/build/xnu/ios-obj/EXPORT_HDRS/osfmk/**/*.h
            # The linked kernel itself: the prelink places the native segments against the collection, so
            # a layout failure (a segment that does not fit a retained range) is diagnosed from these
            # segment sizes, and the image is the prelink input.
            unixnu-core/out/**/build/xnu/ios-obj/**/mach.*.noctf
          if-no-files-found: warn
          retention-days: 7

      - name: Upload PMGR ABI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-ios27-pmgr-abi
          path: |
            unixnu-core/out/**/tree/build/sheng-platform-power/ShengPlatformPower.o
            unixnu-core/out/**/tree/build/sheng-platform-power/OriginalPMGRABI.h
            unixnu-core/out/**/tree/build/sheng-platform-power/GuardedPMGRSlots.inc
            unixnu-core/out/**/tree/build/sheng-platform-power-arm64e/**
            unixnu-core/out/**/tree/build/xnu/ios-obj/**/IOPMGR.cpo
            unixnu-core/out/**/tree/build/xnu/ios-obj/**/IOPMGR.cpo.json
            unixnu-core/out/**/tree/build/xnu/ios-obj/**/IOPlatformExpert.cpo.json
          if-no-files-found: warn
          retention-days: 7
