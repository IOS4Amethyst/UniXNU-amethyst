schema_version = 1

[device]
name = "amethyst"
soc = "SM7635"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Redmi Note 14 Pro+ 5G on SM7635 running iPadOS 17.7.11 from RAM. The main checkpoint reaches the Apple UI with CPU presentation; touch, SMP and GPU work is on the amethyst-touch-gpu-bringup and gpu-addon branches."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform"]
paths = [
  "board.toml",
  "feeds.toml",
  "configs/**",
  ".gitmodules",
  ".github/**",
  ".gitignore",
  "unixnu.lock",
  "AGENTS.md",
  "LICENSE",
  "drivers/ArmDTPlatform",
]
inputs = [
  "SoC SM7635 (soc_source sm7635), OS profile ipados-17.7.11-21H461 (A10 iPad kernelcache, arm64 without PAC).",
  "UniXNU core branch IOS4Amethyst/UniXNU:amethyst-embedded-payload at or after 20437c1.",
  "UEFI IOS4Amethyst/uefi-amethyst:amethyst at or after 4e6782ba.",
  "Branch ios27 instead selects iOS profile ios-27.0.1-24A446 (iPhone15,4, arm64e) and builds XNU at RELEASE: the fileset prelink keeps 256 kexts with __DATA_CONST in 0xfffffff007c18000..0xfffffff008198000 and gives com.apple.kernel the 0xd8000 slot.",
]
configuration = [
  "board.toml [board] kit = \"amethyst\"; [components] include ArmDTPlatform, ArmCpu, SoftwareAES, RamBlock, XnuPrelink, DarwinBoot, AppleKeyStoreState, AdrenoFirmware, ShengUfs.",
  "configs/amethyst_defconfig with arch, sm7635 and ipados config fragments; patch_series arch, soc (xnu-12377), os and device patches/xnu/series.",
  "[payload] kernel_args keep sheng-data-persist=0 and sheng-log=0; test images enable the log explicitly.",
  "Branch ios27: board.toml [kernel] config_level = \"RELEASE\"; scripts/policies/ios-27.0.1-24A446/prelink-regression.json bounds the allow-missing prelink; IOS27-BRINGUP.md records the state and gaps.",
]
procedure = [
  "./unixnu defconfig amethyst_defconfig -D ../UniXNU-amethyst",
  "./unixnu status --json to confirm the resolved overrides and patch order.",
]
findings = [
  "Sm7635Platform is not selected: board services are provided by board-package code and test kernels instead.",
  "The board ADT keeps arm_io_base 0x01000000; a zero parent base made pe_identify_machine return early and skip clock-frequency initialisation.",
  "iOS 27 (branch ios27): the native kernel's __DATA_CONST measures 0xb8000 at RELEASE and 0x120000 at DEVELOPMENT, so only RELEASE fits the 0xd8000 com.apple.kernel slot. Prelink run 42277592719 (map matcher 8, signature bf164371) matched 8632 of 20907 kernel functions and 1312 data objects, and left 321 unresolved closure references over 98 distinct, mostly unnamed kext data operands, with 1530 unmatched kernel functions bound to the _unixnu_fileset_unmapped reporting stub.",
]
completion = [
  "All source pins resolve; every selected component has a record; status shows the intended overrides and patch order.",
]
limits = [
  "Hardware-tested images are packed from local, partly proprietary inputs by scripts/log/pack-log.py; a clean-checkout reproduction is not available.",
]
next_action = [
  "Pin the core and UEFI revisions used by the latest hardware-tested image in this repository.",
]
evidence = [
  { kind = "source", reference = "board.toml", result = "Board identity, component selection, payload and ADT settings." },
]

[[area]]
id = "firmware"
status = "device-verified"
components = ["DarwinBoot"]
paths = [
  "proprietary-files.txt",
  "scripts/ci-bootstrap-candidate.sh",
  "scripts/xnu-panic-screen.c",
]
inputs = [
  "Mu-Silicium UEFI for amethyst (uefi-amethyst:amethyst), stock Amethyst ClockDxe.",
  "Android boot image header v4, pagesize 4096, kernel_offset 0x8000; the bootloader exposes the installed vendor ramdisk, so the payload is embedded in the image.",
]
configuration = [
  "[bootimg.image] header_version = 4; [payload] loader = \"firmware\", size_mib = 80, dram_size 0x1FFE00000.",
  "panic_screen = false: entry/MMU detours are not inserted.",
]
procedure = [
  "./unixnu build firmware --uefi ../uefi-amethyst -D ../UniXNU-amethyst",
  "./unixnu bootimg --uefi ../uefi-amethyst --dtb <amethyst.dtb> -D ../UniXNU-amethyst",
  "fastboot -s <serial> boot <image>.img (never flash).",
]
findings = [
  "Enlarging the FAT32 payload requires rebuilding the BootShim: the ARM64 image length and the embedded payload size passed in x2 must match the actual bytes, otherwise UEFI reports no boot entry.",
  "GPU images use firmware whose PrePi reserves a GMU_Pool region (DXE_Heap1 entry patched in place).",
]
completion = [
  "Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations.",
]
limits = [
  "The GMU_Pool firmware patch is a local tool and not part of uefi-amethyst yet.",
]
next_action = [
  "Move the GMU_Pool reservation into the uefi-amethyst platform configuration.",
]
evidence = [
  { kind = "device", reference = "scripts/log/WORKING-BOOT.md", result = "Redmi Note 14 Pro+ 5G (amethyst), iPadOS 17.7.11 21H461: image amethyst-cpu-present-scale2 (SHA-256 6913b06f...) reached the Apple UI on 2026-11-02; kernel UUID E37ABB7B-1B56-31D9-9351-90EDCD61DEDB; 144 log rounds, zero write errors.", command = "fastboot -s <serial> boot <image>.img (RAM only); in LineageOS Recovery: python3 scripts/log/pull-log.py --out <result-dir> --serial <serial>", revision = "140c844d1118e55e570d2f0ee39113d7635bf211" },
]

[[area]]
id = "cpu"
status = "implemented"
components = ["ArmCpu"]
paths = [
  "package/CpuFreq*",
  "scripts/*armcpu*",
  "scripts/log/*Cpu*",
  "scripts/log/AmethystSmc.c",
]
inputs = [
  "8 CPUs: cpu0 boots running (Cortex-A520 little core), cpu1-7 waiting in the ADT.",
  "EPSS cpufreq domains 0x17d91000/0x17d92000/0x17d93000 with 4/3/1 CPUs (volcano.dtsi).",
]
configuration = [
  "sheng-smp=1 armcpu-spi-ipi=1 armcpu-self-ipi=1 bring up and signal the secondaries.",
  "sheng-cpufreq=4 enables the governor (16 ms windows, schedutil margin, 4-window step-down).",
]
procedure = [
  "Add the SMP and cpufreq arguments (pack-log.py --smp --cpufreq 4), boot, pull the log, read the AmethystSmp and [clocks]/[cpu gov] rows.",
]
findings = [
  "Without armcpu-self-ipi=1 the secondaries keep SIGPdisabled until their first IPI, so a stackshot (DebuggerXCallEnter) could not signal them and the boot hung.",
  "Booting all 8 cores cut time to the lock screen from about 272 s to about 152 s.",
]
completion = [
  "Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU.",
]
limits = [
  "SMP and cpufreq sources live on the amethyst-touch-gpu-bringup branch, not on main.",
]
next_action = [
  "Merge the SMP and cpufreq bring-up into main.",
]
evidence = [
  { kind = "source", reference = "board.toml", result = "ArmCpu selected; secondaries enabled by test-image arguments." },
]

