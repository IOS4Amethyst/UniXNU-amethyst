name: Repair iOS 27 RAM Data role
on:
  push:
    branches: [ios27]
    paths: [.github/workflows/ios27-data-role.yml, scripts/set-ram-data-role.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  role:
    runs-on: macos-15-intel
    environment: ARTIFACT_PASSPHRASE
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: IOS4Amethyst/UniXNU
          ref: ios27-iphone15
          path: unixnu-core
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Repair existing seed without replacing installation UUID
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_PASSPHRASE: ${{ secrets.ARTIFACT_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_PASSPHRASE"
          gh run download 42899327883 -R IOS4Amethyst/UniXNU-amethyst -n ios27-data-seed-encrypted -D input
          mkdir decoded output
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:ARTIFACT_PASSPHRASE -in input/ios27-data-seed.tar.gz.enc | tar xz -C decoded
          echo '7c24e514fbf6ab2d6e62f58560cc60cfad4e0e30b0004c0c158410f6b80f05b4  decoded/data.dbr' | shasum -a 256 -c -
          python3 scripts/set-ram-data-role.py unixnu-core decoded/data.dbr output/data.dbr --uuid 072899DE-BA32-4875-B776-41C1929F4002
          tar -czf - -C output data.dbr data.json | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:ARTIFACT_PASSPHRASE -out ios27-data-role.tar.gz.enc
      - uses: actions/upload-artifact@v4
        with:
          name: ios27-data-role-encrypted
          path: ios27-data-role.tar.gz.enc
          if-no-files-found: error
          retention-days: 7
