[[area]]
id = "storage"
status = "device-verified"
components = ["ShengUfs", "VirtioMmioBlock", "VerifiedRoot", "RamBlock", "SoftwareAES", "AppleKeyStoreState"]
paths = [
  "drivers/ShengUfs",
